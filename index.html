<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WATEEN x JAAFAR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Poppins:wght@600;800&display=swap');

  html, body { 
    margin: 0; 
    padding: 0; 
    background: #090c0a; 
    color: #e2e8f0;
    font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    box-sizing: border-box;
  }

  /* زخرفة تراثية عراقية خفيفة في الخلفية */
  body {
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.15), transparent 70%),
      radial-gradient(circle at 50% 100%, rgba(15, 81, 50, 0.2), transparent 70%);
  }

  #brand { 
    text-align: center; 
    padding: 16px 10px; 
    background: linear-gradient(180deg, #111813 0%, #0d120f 100%);
    border-bottom: 2px solid #c5a059; /* لون ذهبي دافئ */
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    position: relative;
  }

  /* لمسة زخرفية علوية */
  #brand::before {
    content: "❖ ❖ ❖";
    display: block;
    font-size: 10px;
    color: #c5a059;
    letter-spacing: 6px;
    margin-bottom: 4px;
    opacity: 0.8;
  }

  #brand-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .18em;
    background: linear-gradient(45deg, #e6c687, #ffffff, #c5a059);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    text-shadow: 0 0 12px rgba(197, 160, 89, 0.3);
  }

  #brand-sub {
    font-size: 11px;
    color: #8f9e8b;
    letter-spacing: 2px;
    margin-top: 2px;
    font-family: 'Reem Kufi', sans-serif;
  }

  #wrap { 
    padding: 24px 20px; 
    max-width: 480px;
    margin: 20px auto;
    background: rgba(18, 24, 20, 0.6);
    border: 1px solid rgba(197, 160, 89, 0.25);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    text-align: center;
  }

  #state { 
    font-size: 20px; 
    font-weight: 700; 
    margin: 0 0 10px; 
    letter-spacing: 0.5px;
  }

  #det { 
    font-size: 13px; 
    color: #9ab095; 
    margin: 0 0 8px; 
  }

  #det b { 
    color: #e2e8f0; 
    font-weight: 600; 
  }

  #cache { 
    font-size: 12px; 
    color: #6c7e68; 
    margin: 0 0 10px; 
    min-height: 16px; 
  }

  #cache.cacheok { color: #52c41a; }
  .ok { color: #52c41a; } 
  .bad { color: #f5222d; } 
  .warn { color: #faad14; }

  /* إطار أسفل الصفحة كرباط الشناشيل/النخيل */
  .footer-decor {
    margin-top: 30px;
    text-align: center;
    color: #c5a059;
    font-size: 12px;
    opacity: 0.5;
  }
</style>
</head>
<body>

<div id="brand">
  <div id="brand-title">WATEEN x JAAFAR</div>
  <div id="brand-sub">تعديل وإهداء عراقي 🌴</div>
</div>

<div id="wrap">
  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<div class="footer-decor">━━━━━━ 🌴 ━━━━━━</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var queryString = location.search || "";

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = /(?:\?|&)force=1(?:&|$)/.test(queryString);
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;
    function go() { setState("loading jailbreak...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
